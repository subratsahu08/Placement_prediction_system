<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Placement Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🎓 Student Placement Prediction</h1>

        <form action="/predict" method="POST">

            <label>CGPA</label>
            <input type="number" step="0.01" name="cgpa" placeholder="Enter CGPA" required>

            <label>Internships</label>
            <input type="number" name="internships" placeholder="No. of Internships" required>

            <label>Projects</label>
            <input type="number" name="projects" placeholder="No. of Projects" required>

            <label>Workshops / Certifications</label>
            <input type="number" name="workshops" placeholder="No. of Workshops" required>

            <label>Aptitude Test Score</label>
            <input type="number" step="0.01" name="aptitude" placeholder="0 - 100" required>

            <label>Soft Skills Rating</label>
            <input type="number" step="0.1" name="softskills" placeholder="1 - 10" required>

            <label>Extracurricular Activities</label>
            <select name="extracurricular">
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>Placement Training</label>
            <select name="training">
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>SSC Marks (%)</label>
            <input type="number" step="0.01" name="ssc" placeholder="SSC Percentage" required>

            <label>HSC Marks (%)</label>
            <input type="number" step="0.01" name="hsc" placeholder="HSC Percentage" required>

            <button type="submit">
                Predict Placement
            </button>

        </form>

    </div>

</body>

</html>
